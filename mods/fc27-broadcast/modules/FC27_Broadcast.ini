# =============================================================================
# EA FC 27 HyperMotion Broadcast & Replay Telemetry Mod
# For PES 2021 & SmokePatch Football Life 2025 (FL_2025.exe v1.0)
# Compatible with Sider 7.3.4+ | Any Resolution (720p / 1080p / 1440p / 4K)
# =============================================================================

# --- Units & Broadcast Theme ---
# units: "imperial" (mph, yd, ft) or "metric" (km/h, m)
units = imperial

# theme: "eafc" (HyperMotion Volt Neon #AEFF00 + Dark Obsidian Glass)
theme = eafc

# --- HUD Display Mode ---
# companion_hud_enabled = 1 writes real-time events to content\fc27-broadcast\state.json,
# which the transparent broadcast overlay (fc27-overlay\FC27_Overlay.exe) reads and draws
# on top of the game. 0 = no state file, overlay stays blank.
companion_hud_enabled = 1

# auto_launch_companion = 1 starts the transparent click-through overlay automatically
# (fc27-overlay\Start_FC27_Overlay.bat builds it once, then launches it). Set to 0 if you
# prefer starting it yourself - the in-game text overlay keeps working either way.
auto_launch_companion = 1

# How often (Hz) the module rewrites state.json for the companion (1-30).
state_write_hz = 10

# show_scorebug = 1 draws a slim EA FC style score bug in the top-left corner.
# Leave at 0 if the SmokePatch scoreboard already provides one.
show_scorebug = 0

# show_position = 1 shows the registered position (GK/CB/CMF/RWF/...) on player cards.
show_position = 1

# debug_log = 1 writes extra detail (goal_scored payloads, region addresses) to sider.log
debug_log = 0

# --- Feature 1: EA FC 27 Goal Replay Camera & Telemetry ---
replay_camera_enabled = 1
# Preset 1 = EA FC 27 HyperMotion Low-Behind-Shooter / Dramatic Angle
# Preset 2 = EA FC Broadcast Elevated Tactical Replay
# Preset 3 = Vanilla PES/FL2025 Replay Camera (no override)
replay_camera_preset = 1

# Replay Camera fine-tuning (used when replay_camera_preset = 1)
replay_height_cam0 = 0.28
replay_height_cam3 = 0.95
replay_zoom = 0.56

# Duration (in seconds) to show the EA FC 27 Goal Telemetry Card during goal celebration/replay
goal_telemetry_duration = 16.0
# Delay (in seconds) after goal_scored before popping up the Goal Telemetry Card (syncs with replay)
goal_telemetry_delay = 1.2
# Hard limit (in seconds) for how long the custom replay camera may stay engaged
replay_window_max = 45.0

# --- Feature 2: Live Goal & Shot Miss Popup (Total Shots + Match G/A) ---
shot_popup_enabled = 1
# Duration (in seconds) to show the Shot Attempt / Miss / Saved lower-third banner
shot_popup_duration = 6.5

# --- Feature 3: Post-Match Man of the Match (MOTM) Full Stats Card ---
motm_card_enabled = 1
# Duration (in seconds) to show the MOTM Showcase Card during post-match animations
motm_card_duration = 22.0

# --- Polling & Performance ---
# How often (milliseconds) to scan PES/FL2025 match stats & pitch position blocks
stats_poll_ms = 350
position_poll_ms = 120

# --- Advanced: memory region pinning -----------------------------------------
# Leave both empty. The module locates the two private heap blocks itself with
# VirtualQuery (and logs their addresses to sider.log). If a future game build
# ever moves them, paste the addresses from the log here, e.g.
#   stats_region_base = 0x7E0000
#   pitch_region_base = 0x7B0000
stats_region_base =
pitch_region_base =

# --- Hotkeys (Virtual Key Codes, usable anytime or in Sider Overlay) ---
# F8 (0x77) = Trigger Demo Preview (cycles Goal Telemetry -> Shot Miss -> MOTM Card)
# F9 (0x78) = Re-show Last Event Card / Toggle MOTM Card post-match
# F7 (0x76) = Cycle Replay Camera Preset (EA FC HyperMotion / Broadcast / Vanilla)
hotkey_demo_preview = 0x77
hotkey_reshow_card = 0x78
hotkey_cycle_replay_cam = 0x76
