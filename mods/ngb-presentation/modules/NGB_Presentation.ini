# =============================================================================
#  NEXT-GEN FOOTBALL BROADCAST PRESENTATION
#  MOONFROS PRESENTS  -  created by MoonFros
#
#  Football Life 2025 / PES 2021  -  Sider 7  -  NGB_Presentation.lua
#
#  Every value here can be changed while the game is closed; the module reads
#  this file once at start-up.  Restart the game (or reload the module in
#  Sider) after editing.
# =============================================================================

# -----------------------------------------------------------------------------
#  UNITS
#  metric   = km/h, metres          (default)
#  imperial = mph, yards, feet
# -----------------------------------------------------------------------------
units = metric

# -----------------------------------------------------------------------------
#  PRESENTATION
#  presentation_style: 0 = full, 1 = compact, 2 = minimal
#                     (hotkey [7] cycles this during the game)
#  presentation_enabled: master switch (hotkey [8])
#  shot_analysis_enabled: goal trajectory diagram (hotkey [9])
# -----------------------------------------------------------------------------
presentation_enabled = 1
presentation_style = 0
shot_analysis_enabled = 1

# show the small "MOONFROS PRESENTS" credit inside the cards (never over play)
credit_line = 1

# registered position next to the player name (RWF, CB, ...)
show_position = 1

# slim score bug in the top-left corner (off by default - most scoreboards
# already show the score; this is only for clean "no HUD" setups)
show_scorebug = 0

# -----------------------------------------------------------------------------
#  CARD TIMING (seconds)
# -----------------------------------------------------------------------------
goal_telemetry_duration = 13.0
# delay before the goal card appears, so it lands as the replay starts
goal_telemetry_delay = 1.5

shot_popup_enabled = 1
shot_popup_duration = 6.5

motm_card_enabled = 1
motm_card_duration = 20.0

milestone_toast_enabled = 1
milestone_toast_duration = 4.5

# -----------------------------------------------------------------------------
#  GOAL REPLAY CAMERA
#  The mod gently moves the game's own replay camera constants during goal
#  replays and restores the exact values afterwards.
#    1 = subtle low broadcast sweep      2 = higher tactical angle
#    3 = leave the game camera untouched
# -----------------------------------------------------------------------------
replay_camera_enabled = 1
replay_camera_preset = 1
replay_height_cam0 = 0.34
replay_height_cam3 = 1.05
replay_zoom = 0.62
# upper bound of the goal replay window (seconds)
replay_window_max = 45.0

# -----------------------------------------------------------------------------
#  HUD COMPANION  (ngb-overlay\NGB_Overlay.exe)
# -----------------------------------------------------------------------------
# write content\ngb-presentation\state.json for the overlay
companion_hud_enabled = 1
# start the overlay automatically with the game
auto_launch_companion = 1
# how often the state file is rewritten (Hz, 1-30)
state_write_hz = 10

# -----------------------------------------------------------------------------
#  HOTKEYS
#  Virtual-key codes: 0x37 = [7], 0x38 = [8], 0x39 = [9]
#  F7 / F8 / F9 are deliberately NOT used.
#
#  hotkeys_overlay_only = 1  -> the digits only act while the Sider overlay is
#                               open, so they never clash with the game's own
#                               7 / 8 / 9 keys.  Set to 0 to allow them during
#                               play (the game will also see the key press).
# -----------------------------------------------------------------------------
hotkey_prev_style = 0x37
hotkey_toggle_overlay = 0x38
hotkey_toggle_analysis = 0x39
hotkeys_overlay_only = 1

# -----------------------------------------------------------------------------
#  POLLING (milliseconds) - lower = smoother, higher = lighter on the CPU
# -----------------------------------------------------------------------------
stats_poll_ms = 350
position_poll_ms = 120

# -----------------------------------------------------------------------------
#  DIAGNOSTICS
#  1 writes extra detail (region addresses, event payloads) to sider.log.
# -----------------------------------------------------------------------------
debug_log = 0

# -----------------------------------------------------------------------------
#  MEMORY OVERRIDES - leave empty unless you are calibrating a different build
#  Example:  stats_region_base = 0x7E0000
# -----------------------------------------------------------------------------
stats_region_base =
pitch_region_base =
