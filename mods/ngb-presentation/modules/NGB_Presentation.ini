# =============================================================================
#  NEXT-GEN FOOTBALL BROADCAST PRESENTATION
#  MOONFROS PRESENTS  -  created by MoonFros
#
#  Football Life 2025 / PES 2021  -  Sider 7  -  NGB_Presentation.lua
#
#  Every value here can be changed while the game is closed; the module reads
#  this file once at start-up.  Restart the game (or reload the module in
#  Sider) after editing.
# =============================================================================

# -----------------------------------------------------------------------------
#  UNITS
#  metric   = km/h, metres          (default)
#  imperial = mph, yards, feet
# -----------------------------------------------------------------------------
units = metric

# -----------------------------------------------------------------------------
#  PRESENTATION
#  presentation_style: 0 = full, 1 = compact, 2 = minimal
#                     (hotkey [7] cycles this during the game)
#  presentation_enabled: master switch (hotkey [8])
#  shot_analysis_enabled: goal trajectory diagram (hotkey [9])
# -----------------------------------------------------------------------------
presentation_enabled = 1
presentation_style = 0
shot_analysis_enabled = 1

# show the small "MOONFROS PRESENTS" credit inside the cards (never over play)
credit_line = 1

# registered position next to the player name (RWF, CB, ...)
show_position = 1

# slim score bug in the top-left corner. On by default: it is the quickest way
# to see that the overlay is alive, and it only uses the real clock and score.
show_scorebug = 1

# -----------------------------------------------------------------------------
#  CARD TIMING (seconds)
# -----------------------------------------------------------------------------
goal_telemetry_duration = 13.0
# delay before the goal card appears, so it lands as the replay starts
goal_telemetry_delay = 1.5

shot_popup_enabled = 1
shot_popup_duration = 6.5

motm_card_enabled = 1
motm_card_duration = 20.0

# ---------------------------------------------------------------------------
#  Half time / full time
# ---------------------------------------------------------------------------
#  These cards only need the scoreboard, so they work on every build.
result_card_enabled = 1
result_card_duration = 9.0

# ---------------------------------------------------------------------------
#  Data sources
# ---------------------------------------------------------------------------
#  experimental_player_stats: the per player table is found by scanning game
#  memory and is therefore build specific. It stays off until the values pass
#  a sanity check against the scoreboard; until then the HUD shows scoreboard
#  cards only, with no invented numbers. Turn this on to try it.
experimental_player_stats = 0

#  probe_enabled: writes content\ngb-presentation\probe.txt on every goal -
#  scoreboard values, a hexdump of the scoreboard block and a map of the
#  game's memory regions. Only needed when the player table has to be pinned
#  down for a new exe build.
probe_enabled = 0

#  probe_dump_region: also writes the located private stats region byte for byte
#  (content\ngb-presentation\probe_region.bin, up to 4 MB, once per session)
#  next to a small probe_region.txt with its base address and the score.
#  That pair is what tools/decode_probe.py needs to work out the right offsets.
probe_dump_region = 0

#  stat_rec_base / stat_side_stride / stat_rec_stride / stat_kind_stride /
#  stat_kind_offset / stat_buckets: the per player table layout. Leave them out
#  (or commented) unless tools/decode_probe.py gave you values - a calibration
#  file it writes is read automatically. Example, for reference only:
#      stat_rec_base    = 0x7B5C0
#      stat_side_stride = 0x59650
#      stat_rec_stride  = 0x2134
#      stat_kind_stride = 0x24
#      stat_kind_offset = 0x08
#      stat_buckets     = 8

#  goal_fallback_delay_ms: how long a scoreboard goal waits for Sider's goal
#  hook before it is shown as an unnamed card. The hook fires first and the
#  scoreboard catches up seconds later, so this window is what stops one goal
#  from producing two cards. Raise it if your build updates the score late.
goal_fallback_delay_ms = 2500

milestone_toast_enabled = 1
milestone_toast_duration = 4.5

# -----------------------------------------------------------------------------
#  GOAL REPLAY CAMERA
#  The mod gently moves the game's own replay camera constants during goal
#  replays and restores the exact values afterwards.
#    1 = subtle low broadcast sweep      2 = higher tactical angle
#    3 = leave the game camera untouched
# -----------------------------------------------------------------------------
replay_camera_enabled = 1
replay_camera_preset = 1
replay_height_cam0 = 0.34
replay_height_cam3 = 1.05
replay_zoom = 0.62
# upper bound of the goal replay window (seconds)
replay_window_max = 45.0

# -----------------------------------------------------------------------------
#  RENDERER
#
#  dll     = NGB_Render.dll, loaded into the game by this module, draws the
#            cards inside the game's own frame. Works in windowed, borderless
#            AND exclusive fullscreen, focused or not. This is the default.
#  overlay = the old C# transparent window (ngb-overlay\NGB_Overlay.exe).
#            Fallback only: cannot draw over exclusive fullscreen.
#  none    = draw nothing; the Sider overlay text still works.
# -----------------------------------------------------------------------------
renderer = dll

# master switch for the DLL renderer. 0 = the DLL is never asked to draw.
# Equivalent to the in-game kill-switch hotkey.
dll_enabled = 1

# in-game hotkeys, handled by the DLL itself (virtual-key codes):
#   F8  = 0x77  self-test card (proves the render path, with a DEMO badge)
#   F7  = 0x76  renderer diagnostics strip (fps, backbuffer, state age)
#   F12 = 0x7B  kill switch (toggle drawing on/off without restarting)
dll_selftest_hotkey = 0x77
dll_diag_hotkey = 0x76
dll_kill_hotkey = 0x7B

# -----------------------------------------------------------------------------
#  HUD DATA
# -----------------------------------------------------------------------------
# write content\ngb-presentation\state.json for the renderer
companion_hud_enabled = 1
# how often the state file is rewritten (Hz, 1-30)
state_write_hz = 10

# -----------------------------------------------------------------------------
#  HOTKEYS
#  Virtual-key codes: 0x37 = [7], 0x38 = [8], 0x39 = [9]
#  F7 / F8 / F9 are deliberately NOT used.
#
#  hotkeys_overlay_only = 1  -> the digits only act while the Sider overlay is
#                               open, so they never clash with the game's own
#                               7 / 8 / 9 keys.  Set to 0 to allow them during
#                               play (the game will also see the key press).
# -----------------------------------------------------------------------------
hotkey_prev_style = 0x37
hotkey_toggle_overlay = 0x38
hotkey_toggle_analysis = 0x39
hotkeys_overlay_only = 1

# -----------------------------------------------------------------------------
#  POLLING (milliseconds) - lower = smoother, higher = lighter on the CPU
# -----------------------------------------------------------------------------
stats_poll_ms = 350
position_poll_ms = 120

# -----------------------------------------------------------------------------
#  DIAGNOSTICS
#  1 writes extra detail (region addresses, event payloads) to sider.log.
# -----------------------------------------------------------------------------
debug_log = 0

# -----------------------------------------------------------------------------
#  MEMORY OVERRIDES - leave empty unless you are calibrating a different build
#  Example:  stats_region_base = 0x7E0000
# -----------------------------------------------------------------------------
stats_region_base =
pitch_region_base =
